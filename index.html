<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff8a4c">
<link rel="icon" href="icon-192.png">
<style>
/* Layout idea: a bright launcher. One big tile per course, progress shown on the tile. */
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2350;--mute:#6f6a8a;--line:#f0e4c8;--red:#ef3b5d;--yel:#ffc93c;--grad:linear-gradient(120deg,#ffc93c,#ff8a4c 55%,#ef3b5d);--shadow:0 6px 18px rgba(43,35,80,.1)}
@media (prefers-color-scheme:dark){:root{--bg:#1b1730;--card:#28223f;--ink:#f7f1ff;--mute:#b5aed0;--line:#3b3458;--red:#ff6b86;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.flag{background:var(--grad);padding:28px 16px 22px;color:#2b2350;border-radius:0 0 26px 26px;box-shadow:var(--shadow)}
.flag div{max-width:560px;margin:auto}
h1{font-size:30px;line-height:1.1;margin:0 0 4px}
.flag p{margin:0;color:#2b2350;opacity:.8}
main{max-width:560px;margin:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
p{margin:0;color:var(--mute)}
a.tile,div.tile{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
a.tile:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.badge{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:24px;background:var(--grad);color:#2b2350}
.tile strong{display:block;font-size:19px}
.tile span{color:var(--mute);font-size:14px}
.soon{opacity:.6;box-shadow:none!important}
.go{margin-left:auto;color:var(--red);font-weight:700;font-size:26px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){main>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}main>*:nth-child(2){animation-delay:.07s}main>*:nth-child(3){animation-delay:.14s}a.tile{transition:transform .12s}a.tile:active{transform:scale(.97)}}
</style>
</head>
<body>
<div class="flag"><div><h1>Learning Hub</h1><p>Pick what you want to learn today.</p></div></div>
<main>
  <a class="tile" href="kannada/"><div class="badge">&#3221;</div><div><strong>Kannada in 90 Days</strong><span id="kn">Spoken Bengaluru Kannada: lessons, words, verbs, practice</span></div><div class="go">&#8250;</div></a>
  <div class="tile soon"><div class="badge" style="background:var(--line)">R</div><div><strong>React</strong><span>Not added yet</span></div></div>
  <p style="font-size:13px">Works offline after the first open.</p>
</main>
<script>
try{const s=JSON.parse(localStorage.getItem('kn90')||'{}');if(s.xp)document.getElementById('kn').textContent=(s.streak||0)+' day streak · '+s.xp+' XP · '+Object.keys(s.done||{}).length+' of 12 weeks passed'}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
