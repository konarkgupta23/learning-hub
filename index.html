<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff8a4c">
<link rel="icon" href="logo-192.png">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('hubTheme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
<style>
/* Layout idea: a bright launcher. One big tile per course, progress shown on the tile. */
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2350;--mute:#6f6a8a;--line:#f0e4c8;--red:#ef3b5d;--yel:#ffc93c;--grad:linear-gradient(120deg,#ffc93c,#ff8a4c 55%,#ef3b5d);--shadow:0 6px 18px rgba(43,35,80,.1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1730;--card:#28223f;--ink:#f7f1ff;--mute:#b5aed0;--line:#3b3458;--red:#ff6b86;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1730;--card:#28223f;--ink:#f7f1ff;--mute:#b5aed0;--line:#3b3458;--red:#ff6b86;--shadow:0 6px 18px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-wrap:anywhere}
.flag{background:var(--grad);padding:calc(26px + env(safe-area-inset-top,0px)) 16px 22px;color:#2b2350;border-radius:0 0 26px 26px;box-shadow:var(--shadow)}
.flag div{max-width:640px;margin:auto;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
h1{font-size:clamp(26px,7vw,34px);line-height:1.1;margin:0 0 4px}
.flag p{margin:0;color:#2b2350;opacity:.8}
#th{flex:none;border:0;border-radius:99px;background:rgba(255,255,255,.88);color:#2b2350;font:600 14px inherit;padding:6px 12px;cursor:pointer}
main{max-width:640px;margin:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
p{margin:0;color:var(--mute)}
a.tile,div.tile{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.tile>div:nth-child(2){min-width:0;flex:1}
a.tile:focus-visible,#th:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.badge{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:24px;background:var(--grad);color:#2b2350}
.tile strong{display:block;font-size:19px}
.tile span{color:var(--mute);font-size:14px}
.soon{opacity:.6;box-shadow:none!important}
.go{flex:none;color:var(--red);font-weight:700;font-size:26px}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){main>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}main>*:nth-child(2){animation-delay:.07s}main>*:nth-child(3){animation-delay:.14s}a.tile{transition:transform .12s}a.tile:active{transform:scale(.97)}}
</style>
</head>
<body>
<div class="flag"><div><span><h1>Learning Hub</h1><p>Pick what you want to learn today.</p></span><button id="th" type="button"></button></div></div>
<main>
  <a class="tile" href="kannada/"><div class="badge">&#3221;</div><div><strong>Kannada in 90 Days</strong><span id="kn">Spoken Bengaluru Kannada: lessons, words, verbs, practice</span></div><div class="go">&#8250;</div></a>
  <div class="tile soon"><div class="badge" style="background:var(--line)">R</div><div><strong>React</strong><span>Not added yet</span></div></div>
  <p style="font-size:13px">Works offline after the first open.</p>
</main>
<script>
try{const s=JSON.parse(localStorage.getItem('kn90')||'{}');if(s.xp)document.getElementById('kn').textContent=(s.streak||0)+' day streak \u00b7 '+s.xp+' XP \u00b7 '+Object.keys(s.done||{}).length+' of 12 weeks passed'}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){const b=document.getElementById('th');if(!b)return;const r=document.documentElement;
  const show=()=>{b.textContent=r.dataset.theme==='dark'?'\u2600 Bright':'\u263E Dark'};
  b.onclick=()=>{r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('hubTheme',r.dataset.theme)}catch(e){}show()};show()})();
</script>
</body>
</html>
