<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kannada in 90 Days</title>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#c8102e">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@600;800&family=Anek+Kannada:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a one-screen phone app. Karnataka flag yellow and red carry the identity; every Kannada line is shown three ways (roman, Hindi letters, Kannada). */
:root{
  --bg:#f7f5ee; --card:#ffffff; --ink:#2a1216; --mute:#75626a; --line:#e6dfcc;
  --red:#c8102e; --on-red:#ffffff; --yel:#ffcd00; --on-yel:#2a1216; --ok:#1b7f4d; --bad:#b3261e;
  --disp:'Baloo Tamma 2','Anek Kannada',system-ui,sans-serif;
  --body:'Anek Kannada','Noto Sans Kannada','Noto Sans Devanagari',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1013; --card:#27191d; --ink:#f6ecd9; --mute:#b9a5a6; --line:#3d2a2f;
  --red:#ff6278; --on-red:#1a1013; --yel:#ffcd00; --on-yel:#1a1013; --ok:#5fd49a; --bad:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1013; --card:#27191d; --ink:#f6ecd9; --mute:#b9a5a6; --line:#3d2a2f;
  --red:#ff6278; --on-red:#1a1013; --yel:#ffcd00; --on-yel:#1a1013; --ok:#5fd49a; --bad:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);display:flex;flex-direction:column}
header{flex:none;background:var(--card);border-bottom:1px solid var(--line)}
.flag{height:6px;background:linear-gradient(var(--yel) 50%,var(--red) 50%)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;max-width:720px;margin:auto}
.top h1{font:800 22px/1 var(--disp);margin:4px 0 0}
.stats{display:flex;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.pill{background:var(--yel);color:var(--on-yel);border-radius:99px;padding:2px 10px;font-weight:700;white-space:nowrap}
.pill.r{background:var(--red);color:var(--on-red)}
main{flex:1;overflow-y:auto;padding:16px}
.wrap{max-width:720px;margin:auto;display:flex;flex-direction:column;gap:14px}
nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line)}
nav a{flex:1;text-align:center;padding:10px 0 12px;color:var(--mute);text-decoration:none;font:600 14px var(--disp);border-top:3px solid transparent}
nav a.on{color:var(--red);border-top-color:var(--red)}
h2{font:800 24px/1.15 var(--disp);margin:6px 0 0;text-wrap:balance}
h3{font:800 18px/1.2 var(--disp);margin:0 0 6px}
p{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.hi{border-left:6px solid var(--yel)}
.mute{color:var(--mute);font-size:14px}
button,select{font:600 15px var(--body);color:var(--ink)}
.btn{background:var(--red);color:var(--on-red);border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
.btn.y{background:var(--yel);color:var(--on-yel)}
.btn.g{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.ph{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.ph:first-of-type{border-top:0}
.ph b{display:block;font-size:18px;line-height:1.3}
.dv{display:block;font-size:15px;color:var(--red)}
.kn{display:block;font-size:13px;color:var(--mute)}
.ph i{display:block;font-style:normal;font-size:15px}
.sp{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--yel);color:var(--on-yel);cursor:pointer;font-size:13px}
.k{color:var(--red);font-weight:700;cursor:pointer;white-space:nowrap}
details{background:var(--card);border:1px solid var(--line);border-radius:14px}
summary{padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 15px var(--disp);background:var(--bg);border:2px solid var(--line)}
.done .num{background:var(--ok);color:var(--card);border-color:var(--ok)}
.cur .num{background:var(--yel);color:var(--on-yel);border-color:var(--yel)}
summary strong{display:block;font:800 17px/1.2 var(--disp)}
.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.gb{background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px}
.gb h4{margin:0 0 4px;font:800 15px var(--disp)}
.dlg{border-left:3px solid var(--red);padding-left:10px}
.dlg .who{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.path{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.path a{text-decoration:none;color:var(--ink);text-align:center;font-size:12px}
.path .num{margin:0 auto 2px}
.task{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.task input{width:22px;height:22px;accent-color:var(--red);flex:none}
.task a{color:var(--red);font-weight:700;margin-left:auto;white-space:nowrap}
.q{font-size:20px;margin:8px 0 12px}
.q b{display:block;font-size:24px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;font-size:16px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:46px;padding:8px;border:1.5px dashed var(--line);border-radius:10px;margin-bottom:10px}
.chip{background:var(--yel);color:var(--on-yel);border:0;border-radius:8px;padding:8px 12px;cursor:pointer;font-size:16px}
.step{font-size:13px;color:var(--mute);margin:0}
table{width:100%;border-collapse:collapse}
td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{width:38%;font-size:14px;color:var(--mute)}
td b{font-size:18px}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px;max-width:100%}
ul{margin:0;padding-left:20px} li{margin-bottom:6px}
a{color:var(--red)}
.tag{display:block;font-size:12px;color:var(--mute)}
.fh{font:800 15px var(--disp);color:var(--red);margin:14px 0 0}
.warn{border-left:6px solid var(--bad)}
#pad{width:100%;max-width:520px;aspect-ratio:5/2;border:1.5px dashed var(--line);border-radius:10px;touch-action:none;background:var(--bg);display:block}
.big{font-size:44px;line-height:1.3;margin:0}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:transform .1s}.opt:active,.chip:active,.btn:active{transform:scale(.97)}}
</style>
</head>

<header><div class="flag"></div><div class="top"><h1><a href="../" style="color:var(--red);text-decoration:none;font-size:15px;margin-right:8px" aria-label="Back to menu">&#8249; Menu</a>Kannada in 90 Days</h1><div class="stats"><span class="pill r" id="st"></span><span class="pill" id="xp"></span></div></div></header>
<main><div class="wrap" id="v"></div></main>
<nav id="nav"><a href="#today">Today</a><a href="#course">Course</a><a href="#words">Words</a><a href="#verbs">Verbs</a><a href="#practice">Practice</a><a href="#guide">Guide</a></nav>
<script>
/* ---------- script helpers: Kannada -> roman and Hindi letters ---------- */
const VW={'ಅ':'a','ಆ':'ā','ಇ':'i','ಈ':'ī','ಉ':'u','ಊ':'ū','ಋ':'ru','ಎ':'e','ಏ':'ē','ಐ':'ai','ಒ':'o','ಓ':'ō','ಔ':'au'};
const MT={'ಾ':'ā','ಿ':'i','ೀ':'ī','ು':'u','ೂ':'ū','ೃ':'ru','ೆ':'e','ೇ':'ē','ೈ':'ai','ೊ':'o','ೋ':'ō','ೌ':'au'};
const CN={'ಕ':'k','ಖ':'kh','ಗ':'g','ಘ':'gh','ಙ':'ṅ','ಚ':'ch','ಛ':'chh','ಜ':'j','ಝ':'jh','ಞ':'ñ','ಟ':'ṭ','ಠ':'ṭh','ಡ':'ḍ','ಢ':'ḍh','ಣ':'ṇ','ತ':'t','ಥ':'th','ದ':'d','ಧ':'dh','ನ':'n','ಪ':'p','ಫ':'f','ಬ':'b','ಭ':'bh','ಮ':'m','ಯ':'y','ರ':'r','ಲ':'l','ವ':'v','ಶ':'sh','ಷ':'sh','ಸ':'s','ಹ':'h','ಳ':'ḷ'};
function rom(s){let o='';const a=[...s];for(let i=0;i<a.length;i++){const c=a[i],n=a[i+1];
  if(CN[c]){o+=CN[c];if(n==='್')i++;else if(MT[n]){o+=MT[n];i++}else o+='a'}
  else if(VW[c])o+=VW[c];
  else if(c==='ಂ'){const k=CN[n]||'';o+=/^[pbfm]/.test(k)?'m':/^[ṭḍ]/.test(k)?'ṇ':k?'n':'m'}
  else if(c==='ಃ')o+='h';else o+=c}
  return o}
function dev(s){return [...s].map(c=>{let k=c.codePointAt(0);if(k<0xC80||k>0xCFF)return c;
  k={0xC8E:0xC8F,0xC92:0xC93,0xCC6:0xCC7,0xCCA:0xCCB}[k]||k;return String.fromCodePoint(k-0x380)}).join('')}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const ph=(k,e)=>`<div class="ph"><button class="sp" data-say="${k}" aria-label="Listen">&#9654;</button><div><b>${rom(k)}</b><span class="dv">${dev(k)}</span><span class="kn">${k}</span><i>${esc(e)}</i></div></div>`;
const G=h=>h.replace(/\{([^}]+)\}/g,(m,k)=>`<span class="k" data-say="${k}">${rom(k)}</span>`);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);

/* ---------- audio: phone's Kannada voice, else Claude voice, else Hindi voice reading Hindi letters ---------- */
let ctts=null;
try{if(window.claude&&claude.use)claude.use('tts').then(t=>{ctts=t}).catch(()=>{})}catch(e){}
function say(k){try{
  const ss=window.speechSynthesis,vs=ss?ss.getVoices():[];
  const kv=vs.find(v=>/^kn/i.test(v.lang)),hv=vs.find(v=>/^hi/i.test(v.lang));
  const dev1=(t,l,v)=>{const u=new SpeechSynthesisUtterance(t);u.lang=l;if(v)u.voice=v;u.rate=.8;ss.cancel();ss.speak(u)};
  if(kv)return dev1(k,'kn-IN',kv);
  if(ctts)return ctts.speak(k,{language:'kn',rate:.85}).catch(()=>{});
  if(hv)return dev1(dev(k),'hi-IN',hv);
  if(ss)dev1(k,'kn-IN');
}catch(e){}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-say]');if(t)say(t.dataset.say)});

/* ---------- course data ---------- */

    ["No है needed","{ನನ್ನ ಹೆಸರು ರವಿ} = मेरा नाम रवि. Kannada simply drops the है."],

    ["More question words","{ಏನು} क्या · {ಯಾರು} कौन · {ಯಾಕೆ} क्यों · {ಯಾವುದು} कौन सा"],
    ["Yes/no questions","Add -ā to the last word. {ಇದೆ} है → {ಇದೆಯಾ?} है क्या? · {ಬೇಕು} → {ಬೇಕಾ?} · {ಗೊತ್ತು} → {ಗೊತ್ತಾ?}"],
    ["है and नहीं है","{ಇದೆ} = है (it exists, it is there). {ಇಲ್ಲ} = नहीं है."]],

    ["चाहिए = bēku","{ನನಗೆ ನೀರು ಬೇಕು} = मुझे पानी चाहिए, word for word. {ಬೇಡ} = नहीं चाहिए."],
    ["Same pattern, three more","{ನನಗೆ ಗೊತ್ತು} मुझे पता है · {ನನಗೆ ಇಷ್ಟ} मुझे पसंद है · {ನನಗೆ ಸಾಕು} मेरे लिए बस"]],

function form(v,t,i){

  if(t===3)return partOf(v).replace(/ು$/,'ಿ')+IRU[i].slice(1);
  if(t===0)return i===6?v.pa:v.ps+PE[i];

  return v.ps+'ಾ '+IRU[i]}

   ${[["ಕೆಲಸ ಮಾಡಿ ಬರ್ತೀನಿ","काम करके आता हूँ"],["ಕೆಲಸ ಮಾಡಿದ್ಮೇಲೆ ಫೋನ್ ಮಾಡ್ತೀನಿ","काम करने के बाद फ़ोन करूँगा"],["ನೀವು ಹೇಳಿದ್ರೆ ಮಾಡ್ತೀನಿ","आप कहेंगे तो करूँगा"],["ಕಾಫಿ ಕುಡಿಯಕ್ಕೆ ಹೋಗೋಣ","कॉफ़ी पीने चलते हैं"],["ಕನ್ನಡ ಕಲಿಯೋದು ಸುಲಭ","कन्नड़ सीखना आसान है"],["ಊಟ ಮಾಡಿದೀನಿ, ಈಗ ಬೇಡ","खाना खा चुका हूँ, अभी नहीं चाहिए"],["ನಾನು ಮೊದಲು ಡೆಲ್ಲಿಯಲ್ಲಿ ಕೆಲಸ ಮಾಡ್ತಿದ್ದೆ","मैं पहले दिल्ली में काम करता था"],["ನನಗೆ ನಾಳೆ ಬರಕ್ಕೆ ಆಗಲ್ಲ, ಆದ್ರೆ ಫೋನ್ ಮಾಡ್ತೀನಿ","मैं कल नहीं आ सकता, लेकिन फ़ोन करूँगा"]].map(x=>ph(x[0],x[1])).join('')}</div>
  <div class="card hi"><h3>Verb drill</h3><div id="vd"><p>Ten quick questions. Pick the right form.</p><button class="btn" id="vgo">Start drill</button></div></div>`;
  const sel=$('#vsel');sel.value=vi;sel.onchange=()=>{vi=+sel.value;tbl();fam()};

function tbl(){const x=VB[vi];document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',+b.dataset.t===vt));
  const row=(a,k)=>`<tr><td>${a}</td><td><b class="k" data-say="${k}">${rom(k)}</b><span class="dv">${dev(k)}</span></td></tr>`;
  let h;if(vt<4)h=PR.map((p,i)=>row(`<b style="font-size:15px;color:var(--ink)">${rom(p[0])}</b><br>${p[1]}`,form(x,vt,i))).join('');
  else{const st=x.pn.replace(/ಲಿಲ್ಲ$/,'');h=[['Won\'t / doesn\'t (any person)',x.n],['Didn\'t (any person)',x.pn],['Please do',x.im],['Please don\'t',st+'ಬೇಡಿ'],['Have to',st+'ಬೇಕು'],['Shall I?',st+'ಲಾ?']].map(r=>row(r[0],r[1])).join('')}
  $('#vt').innerHTML=`<table>${h}</table>`+(vt>=2&&vt<4&&x.r==='ಇರು'?'<p class="mute">For iru the first tab already means am, right now.</p>':'')}
function drill(){let n=0,sc=0;const box=$('#vd');
  const next=()=>{if(n>=10){touch(sc*4,2);box.innerHTML=`<p><b>${sc} of 10.</b> ${sc>=8?'Sakkat!':'Look at the table again and retry.'}</p><button class="btn" id="vgo">Again</button>`;$('#vgo').onclick=drill;return}
    const x=VB[Math.random()*VB.length|0],t=Math.random()*4|0,i=Math.random()*8|0,ans=form(x,t,i);
    const opts=shuf([...new Set(shuf(PR.map((p,j)=>form(x,t,j)).concat(form(x,(t+1)%2,i))).filter(f=>f!==ans))].slice(0,3).concat(ans));
    box.innerHTML=`<p class="step">${n+1} of 10</p><div class="q">${PR[i][1].split(' · ')[0]} + ${x.en} + ${TN[t].toLowerCase()}<span class="dv">${x.hi}</span></div>`+opts.map(o=>`<button class="opt" data-o="${o}">${rom(o)}</button>`).join('');
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(box.querySelector('.nx'))return;const ok=b.dataset.o===ans;if(ok)sc++;b.classList.add(ok?'ok':'no');
      box.querySelectorAll('.opt').forEach(c=>{if(c.dataset.o===ans)c.classList.add('ok')});say(ans);n++;
      box.insertAdjacentHTML('beforeend','<button class="btn nx">Next</button>');box.querySelector('.nx').onclick=next})};
  next()}


let wp=0;
function vWords(){const p=WP[wp];
  v.innerHTML=`<h2>Words</h2><p class="mute">Everyday Bengaluru speech by situation, plus packs for recognising insults and threats.</p><div class="tabs" style="flex-wrap:wrap">${WP.map((x,i)=>`<button data-p="${i}" class="${i===wp?'on':''}">${x.t}</button>`).join('')}</div>
  <div class="card ${p.w?'warn':''}"><h3>${p.t}</h3>${p.n?`<p>${G(p.n)}</p>`:''}${p.i.map(x=>ph(x[0],x[1])).join('')}<div class="row" style="margin-top:10px">${p.w?'':'<button class="btn" id="wc">Flashcards</button>'}<button class="btn y" id="wq">${p.w?'Recognition quiz':'Quiz this pack'}</button></div></div>`;
  v.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{wp=+b.dataset.p;vWords()});
  const go=m=>{pend={m,w:100+wp};location.hash='practice'};
  if($('#wc'))$('#wc').onclick=()=>go('cards');$('#wq').onclick=()=>go('quiz')}
let pend=null,pw=-1;
function pool(w){if(w>=100)return WP[w-100].i.map(p=>({k:p[0],e:p[1]}));const a=[];W.forEach((x,i)=>{if(w<0?i<=curWeek():i===w)a.push(...x.p,...(x.x||[]))});return a.map(p=>({k:p[0],e:p[1]}))}
function vPractice(){v.innerHTML=`<h2>Practice</h2><div class="card"><div class="row"><label for="psel" class="mute">Material</label><select id="psel"><option value="-1">Everything up to my current week</option>${W.map((w,i)=>`<option value="${i}">Week ${i+1}: ${w.t}</option>`).join('')}${WP.map((w,i)=>`<option value="${100+i}">Words: ${w.t}</option>`).join('')}</select></div>
  <div class="row" style="margin-top:10px"><button class="btn" data-m="cards">Flashcards</button><button class="btn y" data-m="quiz">Quiz</button><button class="btn g" data-m="build">Sentence builder</button></div></div><div class="card" id="pa"><p>Flashcards train speaking: read the English, say the Kannada aloud, then flip.</p><p>The quiz tests understanding both ways. The sentence builder trains word order.</p></div>`;
  const sel=$('#psel');sel.value=pw;sel.onchange=()=>pw=+sel.value;
  const run=m=>({cards,quiz,build})[m](pw);
  v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>run(b.dataset.m));
  if(pend){pw=pend.w;sel.value=pw;const m=pend.m;pend=null;run(m)}}
function cards(w){const pa=$('#pa'),P=shuf(pool(w)).sort((a,b)=>(S.box[a.k]||0)-(S.box[b.k]||0)).slice(0,10);let i=0;
  const next=()=>{if(i>=P.length){touch(20,0);pa.innerHTML='<p><b>Session done.</b> Cards you missed will come back first next time.</p>';return}
    const c=P[i];pa.innerHTML=`<p class="step">Card ${i+1} of ${P.length}</p><div class="q">${esc(c.e)}</div><p class="mute">Say it aloud in Kannada, then check.</p><button class="btn" id="fl">Show Kannada</button>`;
    $('#fl').onclick=()=>{pa.innerHTML=`<p class="step">Card ${i+1} of ${P.length}</p>${ph(c.k,c.e)}<div class="row"><button class="btn g" id="ag">Missed it</button><button class="btn" id="ok">Got it</button></div>`;say(c.k);
      $('#ag').onclick=()=>{S.box[c.k]=0;i++;next()};$('#ok').onclick=()=>{S.box[c.k]=Math.min(5,(S.box[c.k]||0)+1);i++;next()}}};
  next()}
function quiz(w){const pa=$('#pa'),P=pool(w),qs=shuf(P).slice(0,8);let i=0,sc=0;
  const next=()=>{if(i>=qs.length){const pass=sc/qs.length>=.75;if(w>=0&&w<100&&pass)S.done[w]=1;touch(sc*5,w>=0&&w<100?1:null);
      pa.innerHTML=`<p><b>${sc} of ${qs.length}.</b> ${pass?(w>=0&&w<100?`Week ${w+1} passed. Chennāgide!`:'Chennāgide!'):'Under 75%. Review the lesson and try again.'}</p><div class="row"><button class="btn" id="rq">New quiz</button><a class="btn g" href="#course" style="text-decoration:none">Back to course</a></div>`;$('#rq').onclick=()=>quiz(w);return}
    const q=qs[i],dir=i%2,opts=shuf([q,...shuf(P.filter(p=>p.e!==q.e&&p.k!==q.k)).slice(0,3)]);
    pa.innerHTML=`<p class="step">Question ${i+1} of ${qs.length}</p><div class="q">${dir?esc(q.e):`<b class="k" data-say="${q.k}">${rom(q.k)}</b><span class="dv">${dev(q.k)}</span>`}</div>`+opts.map((o,j)=>`<button class="opt" data-j="${j}">${dir?rom(o.k):esc(o.e)}</button>`).join('');
    pa.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(pa.querySelector('.nx'))return;const ok=opts[b.dataset.j]===q;if(ok)sc++;b.classList.add(ok?'ok':'no');
      pa.querySelectorAll('.opt').forEach(c=>{if(opts[c.dataset.j]===q)c.classList.add('ok')});say(q.k);i++;
      pa.insertAdjacentHTML('beforeend','<button class="btn nx">Next</button>');pa.querySelector('.nx').onclick=next})};
  next()}
function build(w){const pa=$('#pa'),clean=k=>rom(k).replace(/[?.,!]/g,'').split(/\s+/);
  let P=pool(w).filter(p=>{const n=clean(p.k).length;return n>=3&&n<=7});if(!P.length)P=pool(-1).filter(p=>clean(p.k).length>=3);
  const qs=shuf(P).slice(0,5);let i=0,sc=0;
  const next=()=>{if(i>=qs.length){touch(sc*8);pa.innerHTML=`<p><b>${sc} of ${qs.length} built correctly.</b></p><button class="btn" id="rb">More sentences</button>`;$('#rb').onclick=()=>build(w);return}
    const q=qs[i],tg=clean(q.k);let bank=shuf(tg.map((t,j)=>({t,j}))),ans=[];
    const draw=()=>{pa.innerHTML=`<p class="step">Sentence ${i+1} of ${qs.length}</p><div class="q">${esc(q.e)}</div><div class="chips" id="an">${ans.map((c,x)=>`<button class="chip" data-a="${x}">${c.t}</button>`).join('')}</div><div class="chips" id="bk" style="border-style:solid">${bank.map((c,x)=>`<button class="chip" data-b="${x}">${c.t}</button>`).join('')}</div><div id="fb"></div>`;
      pa.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{ans.push(bank.splice(+b.dataset.b,1)[0]);draw();if(!bank.length)check()});
      pa.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{bank.push(ans.splice(+b.dataset.a,1)[0]);draw()})};
    const check=()=>{const ok=ans.map(c=>c.t).join(' ')===tg.join(' ');if(ok)sc++;say(q.k);i++;
      $('#fb').innerHTML=`<p style="color:var(--${ok?'ok':'bad'})"><b>${ok?'Correct':'The usual order is:'}</b></p>${ph(q.k,q.e)}<button class="btn nx">Next</button>`;
      pa.querySelectorAll('.chip').forEach(c=>c.disabled=true);pa.querySelector('.nx').onclick=next};
    draw()};
  next()}
function vGuide(){const yt=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
  v.innerHTML=`<h2>Guide</h2>
  <div class="card hi"><h3>How to use this</h3><ul><li><b>Three lines per phrase.</b> Roman letters for exact length and tongue position, Hindi letters in red for your ear, Kannada script only as a reference. You do not need to read the script.</li><li><b>Words tab.</b> Everyday Bengaluru vocabulary by situation. Add one pack a week alongside the lesson.</li><li><b>Speak every line aloud.</b> Silent reading builds recognition, not speech.</li><li><b>30 minutes a day</b>, split as on the Today tab. Idle five minutes: do flashcards or one verb drill.</li><li><b>One week, one lesson.</b> Pass the quiz, do the real-world mission, move on.</li><li>Progress is saved on this phone. Once installed, everything except the outside links works offline.</li></ul></div>
  <div class="card"><h3>Sounds: what Hindi already gives you</h3><p>Almost every Kannada sound exists in Hindi. Fix these seven things and you will sound right.</p>
   ${[["Say the last vowel","Hindi drops the final a. Kannada never does. It is Kannada, not Kannad. {ಬೇಡ} has two beats, {ಮನೆ} has two beats. The red Hindi line cannot show this, so trust the roman line."],
      ["Short e and short o","Hindi has only long ए and ओ. Kannada has both. Short: {ಎಲೆ} leaf, {ಒಂದು} one. Long: {ಏಳು} seven, {ಓದು} read. In roman, a bar on top (ē, ō) means long. No bar means clipped, like the e in English pen."],
      ["ḷ is Marathi ळ","Curl the tongue tip back and flap it. {ಹಳ್ಳಿ} village against {ಹಲ್ಲಿ} lizard. {ಹೇಳಿ} · {ಮಳೆ} · {ನಾಳೆ}"],
      ["Dots mean retroflex","ṭ ḍ ṇ are ट ड ण. Plain t d n are त द न. {ಊಟ} meal has ट. {ಹತ್ತು} ten has त."],
      ["Hold double letters","Like पक्का and बच्चा. {ಅಕ್ಕ} · {ಅಣ್ಣ} · {ಇಲ್ಲ} · {ಬನ್ನಿ} · {ಹತ್ತು}"],
      ["Long vowels are really long","ā ī ū last twice as long. {ಬಾ} come, {ನೀರು} water, {ಊರು} town."],
      ["ai is अइ, not Hindi ऐ","{ಐದು} five sounds like a-i-du."]].map(x=>`<div class="gb" style="margin-bottom:8px"><h4>${x[0]}</h4>${G(x[1])}</div>`).join('')}
   <p class="mute">The play buttons use a machine voice from your phone or from Claude. It is a rough guide. For true pronunciation, copy the native audio in the resources below.</p></div>
  <div class="card"><h3>Write your name</h3><p>You are skipping the script, so this is the one word to learn by hand.</p><p class="big" id="nm">ಕೋನಾರ್ಕ್</p>
   <p><b>ಕೋ</b> kō · <b>ನಾ</b> nā · <b>ರ್ಕ್</b> rk. The r is the small hook drawn after ಕ, even though you say it before the k. The tick on top of the last letter removes the final a, so it ends in k.</p>
   <p class="mute">If you say your name with ण as in Hindi कोणार्क, write ಕೋಣಾರ್ಕ್ instead.</p>
   <div class="row" style="margin-bottom:8px"><button class="btn g" id="n1">ಕೋನಾರ್ಕ್</button><button class="btn g" id="n2">ಕೋಣಾರ್ಕ್</button><button class="btn" id="ncl">Clear</button></div>
   <canvas id="pad" width="1000" height="400" aria-label="Trace your name with a finger"></canvas><p class="mute">Trace over the faint letters with your finger. Five times a day for a week and it sticks.</p></div>
  <div class="card"><h3>What three months gets you</h3><p>With 30 minutes a day plus real conversations, expect to handle daily life in Kannada: shops, autos, office small talk, simple stories, and following slow speech. Fast group chatter and films without subtitles take longer. The speed-up is real people: the weekly missions matter more than any app.</p></div>
  <div class="card"><h3>Listen and practise outside</h3><ul>
   <li><a href="https://ccat.sas.upenn.edu/plc/kannada/" target="_blank" rel="noopener">University of Pennsylvania: Spoken Kannada lessons and grammar</a>. Free. The best reference when you want to know why a form is the way it is.</li>
   <li><a href="https://goethe-verlag.com/study-kannada-online.html" target="_blank" rel="noopener">50Languages Kannada</a>. 100 free lessons with native audio, and an app that works offline.</li>
   <li><a href="https://kannadagottilla.com/kannada-courses" target="_blank" rel="noopener">Kannada Gottilla</a>. Paid WhatsApp and Google Meet classes from Bengaluru, built for people who moved here.</li>
   <li><a href="${yt('spoken Kannada through Hindi')}" target="_blank" rel="noopener">YouTube: spoken Kannada through Hindi</a> and <a href="${yt('spoken Kannada through English daily conversation')}" target="_blank" rel="noopener">through English</a>. Pick one channel and follow it for native pronunciation.</li>
   <li><a href="${yt('Kannada movie scenes with English subtitles')}" target="_blank" rel="noopener">YouTube: Kannada film scenes with subtitles</a>. From week 6, watch 10 minutes a day. Films to look for: Kirik Party, Lucia, Kantara, Ulidavaru Kandanthe.</li>
   <li><a href="https://preply.com/en/blog/apps-to-learn-kannada/" target="_blank" rel="noopener">Preply's comparison of Kannada apps and tutors</a>, if you want a paid speaking partner from week 5.</li>
   <li><a href="https://www.alllanguageresources.com/kannada-resources/" target="_blank" rel="noopener">All Language Resources: reviewed list of Kannada tools</a>.</li>
   <li><a href="https://www.deccanherald.com/india/karnataka/bengaluru/heres-where-you-can-learn-kannada-909431.html" target="_blank" rel="noopener">Deccan Herald: Kannada classes in Bengaluru</a>.</li></ul></div>
  <div class="card"><h3>Weekly rhythm</h3><ul><li><b>Mon to Fri:</b> the 30-minute plan.</li><li><b>Saturday:</b> the week's quiz and sentence builder, then the real-world mission.</li><li><b>Sunday:</b> one Kannada film or 30 minutes of songs. No study.</li><li><b>Weeks 4 to 12:</b> verb drill every single day. Verbs are the whole game.</li></ul></div>`
  const c=$('#pad'),x=c.getContext('2d');let nm='ಕೋನಾರ್ಕ್',dn=false;
  const base=()=>{const cs=getComputedStyle(document.documentElement);x.clearRect(0,0,1000,400);x.globalAlpha=.18;x.fillStyle=cs.getPropertyValue('--ink');x.font='230px "Anek Kannada","Noto Sans Kannada",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(nm,500,215);x.globalAlpha=1;x.strokeStyle=cs.getPropertyValue('--red');x.lineWidth=12;x.lineCap=x.lineJoin='round'};
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*1000/r.width,(e.clientY-r.top)*400/r.height]};
  c.onpointerdown=e=>{dn=true;x.beginPath();x.moveTo(...pt(e));try{c.setPointerCapture(e.pointerId)}catch(_){}};
  c.onpointermove=e=>{if(dn){x.lineTo(...pt(e));x.stroke()}};c.onpointerup=c.onpointercancel=()=>dn=false;
  const set=n=>{nm=n;$('#nm').textContent=n;base()};$('#n1').onclick=()=>set('ಕೋನಾರ್ಕ್');$('#n2').onclick=()=>set('ಕೋಣಾರ್ಕ್');$('#ncl').onclick=base;
  base();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(base)}
